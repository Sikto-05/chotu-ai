name: CHOTU AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil requests beautifulsoup4 python-dotenv numpy

      - name: Syntax check all Python files
        run: |
          python -m py_compile main.py
          python -m py_compile setup_wizard.py
          python -m py_compile core/chotu_brain.py
          python -m py_compile core/tool_executor.py
          python -m py_compile core/memory_bank.py
          python -m py_compile core/startup_manager.py
          python -m py_compile skills/file_navigator.py
          python -m py_compile skills/system_monitor.py
          python -m py_compile skills/web_intel.py
          python -m py_compile skills/app_controller.py
          echo "All syntax checks passed."

  package:
    runs-on: ubuntu-latest
    needs: syntax-check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: |
          mkdir -p CHOTU-AI-Release
          cp -r core skills assets main.py setup_wizard.py requirements.txt README.md install.bat .env.example CHOTU-AI-Release/
          mkdir -p CHOTU-AI-Release/data
          touch CHOTU-AI-Release/data/.gitkeep
          zip -r CHOTU-AI-v1.0.0.zip CHOTU-AI-Release/
          echo "Archive size: $(du -sh CHOTU-AI-v1.0.0.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHOTU-AI-v1.0.0
          path: CHOTU-AI-v1.0.0.zip
          retention-days: 90
